services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nammakannada-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./nammakannada.db
      - FRONTEND_ORIGIN=http://localhost:3000
      - ENVIRONMENT=production
      - SECRET_KEY=prod-secret-key-nammakannada-kscst-2026
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=kannada-admin-secure-pass-2026
    volumes:
      - ./backend/nammakannada.db:/app/nammakannada.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nammakannada-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
